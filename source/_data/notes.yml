  title: 信号与系统
  subject: 电子信息工程课程笔记
  description: 信号与系统是一门大二下学期的课程，难度中规中矩，主要还是数学知识。相比于模电和电磁场，我对本课程的评价是有用而且学得懂，后续很多项目和工程中也会用到相关的概念，建议各位认真理解与学习。对于考试的问题，题目比较常规，注意审题与方法的选取，其实在我看来审题伸出来题目属于那一块的知识之后，各种方法大同小异，因为考试题给出的提示还是很明显的，和往年题思路也类似。
